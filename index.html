<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엔트로피 공동구매 & 시딩 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #faf6f4; --card-bg: #ffffff; --ink: #3a2e2c; --sub: #8a7a76;
    --accent: #c98a92; --accent-dark: #a8636d; --accent-soft: #f3dde0;
    --line: #ece2df; --ok: #7fa88a; --warn: #d9a441; --danger: #c56b5f; --info: #7c96b8;
    --sidebar-w: 220px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); }
  button { font-family:inherit; cursor:pointer; }

  /* ---- Login screen ---- */
  #loginScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:40px 36px; text-align:center; max-width:340px; box-shadow:0 8px 30px rgba(0,0,0,0.05); }
  .login-card .emoji { font-size:40px; margin-bottom:10px; }
  .login-card h1 { font-size:18px; margin:0 0 6px; }
  .login-card p { font-size:12.5px; color:var(--sub); margin:0 0 22px; line-height:1.6; }
  .google-btn { width:100%; padding:11px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:13.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px; }
  .google-btn:hover { background:#fafafa; }
  .login-error { color:var(--danger); font-size:12px; margin-top:14px; }

  /* ---- App shell ---- */
  #app { display:none; }
  #app.active { display:flex; min-height:100vh; }
  .sidebar { width:var(--sidebar-w); background:#fff; border-right:1px solid var(--line); flex-shrink:0; transition:margin-left .2s; display:flex; flex-direction:column; }
  .sidebar.collapsed { margin-left:calc(-1 * var(--sidebar-w)); }
  .sidebar .brand { padding:20px 18px 14px; font-weight:700; font-size:15px; border-bottom:1px solid var(--line); }
  .sidebar .brand small { display:block; font-weight:400; color:var(--sub); font-size:11px; margin-top:2px; }
  .nav { padding:10px; flex:1; overflow-y:auto; }
  .nav-group-label { font-size:10.5px; font-weight:700; letter-spacing:.03em; color:var(--sub); text-transform:uppercase; padding:14px 12px 4px; }
  .nav-group-label:first-child { padding-top:4px; }
  .nav button { width:100%; text-align:left; padding:9px 12px; border:none; background:none; border-radius:8px; font-size:13px; color:var(--ink); margin-bottom:1px; }
  .nav button:hover { background:var(--bg); }
  .nav button.active { background:var(--accent-soft); color:var(--accent-dark); font-weight:600; }
  .nav button.soon { color:var(--sub); }
  .soon-page { padding:40px 20px; text-align:center; color:var(--sub); }
  .soon-page .icon { font-size:34px; margin-bottom:10px; }
  .cal-grid-wrap { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; }
  .cal-headrow { display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--line); }
  .cal-head { text-align:center; font-size:11px; color:var(--sub); font-weight:600; padding:8px 0; }
  .cal-week { display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:22px 18px 18px 18px 13px; position:relative; border-bottom:1px solid var(--line); }
  .cal-week:last-child { border-bottom:none; }
  .cal-colbg { grid-row:1/-1; border-right:1px solid var(--line); }
  .cal-colbg:last-child { border-right:none; }
  .cal-daynum-cell { grid-row:1; padding:3px 6px 0; font-size:11px; color:var(--ink); }
  .cal-daynum-cell.other-month { color:var(--sub); opacity:.45; }
  .cal-daynum-cell .num { display:inline-block; min-width:18px; height:18px; line-height:18px; text-align:center; border-radius:50%; }
  .cal-daynum-cell.today .num { background:var(--accent-dark); color:#fff; font-weight:700; }
  .cal-bar { margin:1px 2px 0; padding:0 6px; border-radius:4px; font-size:10.5px; font-weight:600; line-height:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#fff; cursor:default; }
  .cal-bar.round { background:var(--accent); }
  .cal-bar.gcal { background:var(--info); }
  .cal-overflow { grid-row:5; font-size:9.5px; color:var(--sub); padding:0 6px; }
  .sidebar .userbox { padding:14px 18px; border-top:1px solid var(--line); font-size:11.5px; color:var(--sub); }
  .sidebar .userbox a { color:var(--accent-dark); cursor:pointer; text-decoration:underline; }

  .main { flex:1; min-width:0; }
  .topbar { display:flex; align-items:center; gap:14px; padding:14px 24px; border-bottom:1px solid var(--line); background:#fff; }
  .topbar .hamburger { font-size:18px; background:none; border:none; color:var(--ink); }
  .topbar h2 { font-size:15px; margin:0; }
  .topbar .desc { font-size:11.5px; color:var(--sub); margin-left:auto; }

  .content { padding:22px 26px 60px; max-width:1280px; margin:0 auto; }

  .kpi-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:26px; }
  .kpi-card { background:var(--card-bg); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .kpi-card .label { font-size:12px; color:var(--sub); margin-bottom:6px; }
  .kpi-card .value { font-size:21px; font-weight:700; }
  .kpi-card .sub { font-size:11px; color:var(--sub); margin-top:4px; }

  .panel { background:var(--card-bg); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:20px; }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  canvas { max-height:250px; }

  .controls { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
  .controls select, .controls input { border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:12.5px; background:#fff; color:var(--ink); }
  .controls input { flex:1; min-width:160px; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:600; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { background:var(--accent-dark); }
  .btn.ghost { background:#fff; }
  .btn.small { padding:4px 9px; font-size:11.5px; }

  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--sub); font-weight:600; white-space:nowrap; }
  tbody tr:hover { background:#fdf9f8; }
  .table-wrap { max-height:460px; overflow-y:auto; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .muted { color:var(--sub); }
  .row-actions { white-space:nowrap; }

  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap; }
  .badge.confirm { background:#eaf3ec; color:var(--ok); }
  .badge.meeting { background:#eef2f7; color:var(--info); }
  .badge.need { background:#fbf3e2; color:var(--warn); }
  .badge.drop { background:#fbeae7; color:var(--danger); }
  .badge.upcoming { background:var(--accent-soft); color:var(--accent-dark); }
  .badge.cold { background:#f1eeec; color:var(--sub); }
  .badge.gift { background:#eef2f7; color:var(--info); }

  .spotlight-card { border-left:3px solid var(--accent); background:#fffaf9; border-radius:10px; padding:12px 16px; margin-bottom:10px; }
  .spotlight-card .row1 { display:flex; justify-content:space-between; font-size:13.5px; font-weight:600; }
  .spotlight-card .row2 { font-size:12px; color:var(--sub); margin-top:4px; }

  /* ---- Modal ---- */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(58,46,44,0.35); align-items:center; justify-content:center; z-index:50; }
  .modal-overlay.active { display:flex; }
  .modal { background:#fff; border-radius:14px; padding:26px; width:520px; max-width:92vw; max-height:86vh; overflow-y:auto; }
  .modal h3 { margin:0 0 16px; font-size:15px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:11.5px; color:var(--sub); margin-bottom:4px; }
  .field input, .field select, .field textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; }
  .field textarea { resize:vertical; min-height:50px; }
  .field-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }

  .loading-note { color:var(--sub); font-size:12.5px; padding:20px; text-align:center; }
  .toast { position:fixed; bottom:20px; right:20px; background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:12.5px; opacity:0; transform:translateY(8px); transition:.25s; z-index:80; }
  .toast.show { opacity:1; transform:translateY(0); }

  @media (max-width:1000px) {
    .kpi-grid { grid-template-columns:repeat(2,1fr); }
    .grid-2 { grid-template-columns:1fr; }
    .field-row { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

  <div class="main">

<script>
const SUPABASE_URL = 'https://xwlaqcniqqbjpgbgjxzk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3bGFxY25pcXFianBnYmdqeHprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNjUyMDEsImV4cCI6MjEwMDk0MTIwMX0.ch_dnrsicjuSyT7R6nHsArrOs3u_clAj-DSXjZ7NdG0';
const ALLOWED_DOMAIN = 'entropymakeup.com';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let CONTACTS = [];
let ROUNDS = [];
let ORGANIC = [];
let CAMPAIGNS = [];
let CAMPAIGN_COLLABS = [];
let CAMPAIGN_IMPROVEMENTS = [];
let COLLAB_PROPOSALS = [];
let CALENDAR_EVENTS = [];
let activeTab = 'overview';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function won(n) { if (n===null||n===undefined) return '-'; return '₩' + Math.round(n).toLocaleString('ko-KR'); }
function pct(n) { if (n===null||n===undefined) return '-'; return (n*100).toFixed(0) + '%'; }
function esc(s) { if (s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function statusBadgeClass(s) {
  if (s === '확정') return 'confirm';
  if (s === '조건협의') return 'meeting';
  if (s === '응답') return 'upcoming';
  if (s === '컨택') return 'need';
  if (s === '콜드') return 'cold';
  if (s === '선물완료') return 'gift';
  if (s === '드랍') return 'drop';
  return '';
}

// ---------------- AUTH ----------------
document.getElementById('googleLoginBtn').onclick = async () => {
  await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href, queryParams: { hd: ALLOWED_DOMAIN } }
  });
};
document.getElementById('logoutBtn').onclick = async () => {
  await sb.auth.signOut();
  window.location.reload();
};

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showLogin(); return; }
  const email = session.user.email || '';
  if (!email.endsWith('@' + ALLOWED_DOMAIN)) {
    document.getElementById('loginError').textContent = '@' + ALLOWED_DOMAIN + ' 계정만 사용할 수 있어요. (' + email + ')';
    await sb.auth.signOut();
    showLogin();
    return;
  }
  document.getElementById('userEmail').textContent = email;
  showApp();
  await loadData();
}
function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').classList.remove('active');
}
function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
}
sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_IN') boot(); });
boot();

document.getElementById('hamburgerBtn').onclick = () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
};
document.querySelectorAll('.nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    document.getElementById('pageTitle').textContent = btn.dataset.title || btn.textContent.replace(/^\S+\s/, '');
    render();
  };
});

// ---------------- DATA ----------------
// Supabase/PostgREST는 한 번에 최대 1000행(기본 max-rows 설정)까지만 반환하므로,
// 데이터가 1000건을 넘는 테이블(예: 협업 컨택 리스트)에서도 안 잘리도록 페이지 단위로 끝까지 가져온다.
async function fetchAllRows_(table, orderCol, ascending) {
  const PAGE = 1000;
  let all = [];
  let from = 0;
  while (true) {
    let q = sb.from(table).select('*').range(from, from + PAGE - 1);
    if (orderCol) q = q.order(orderCol, { ascending: !!ascending });
    const res = await q;
    if (res.error) return { data: all, error: res.error.message };
    const page = res.data || [];
    all = all.concat(page);
    if (page.length < PAGE) break;
    from += PAGE;
  }
  return { data: all, error: null };
}
async function loadData() {
  document.getElementById('content').innerHTML = '<div class="loading-note">불러오는 중…</div>';
  const [c, r, o, cp, cc, ci, cpr, gc] = await Promise.all([
    fetchAllRows_('contacts', 'created_at', false),
    fetchAllRows_('group_buy_rounds', 'start_date', false),
    fetchAllRows_('organic_content_mentions', 'mention_date', false),
    fetchAllRows_('campaigns', 'created_at', false),
    fetchAllRows_('campaign_collabs'),
    fetchAllRows_('campaign_improvements'),
    fetchAllRows_('collab_proposals'),
    fetchAllRows_('calendar_events', 'start_date', false),
  ]);
  if (c.error) { toast('contacts 로드 실패: ' + c.error); }
  if (r.error) { toast('group_buy_rounds 로드 실패: ' + r.error); }
  if (o.error) { toast('organic_content_mentions 로드 실패: ' + o.error); }
  if (cp.error) { toast('campaigns 로드 실패: ' + cp.error); }
  if (cpr.error) { toast('collab_proposals 로드 실패: ' + cpr.error); }
  if (gc.error) { toast('calendar_events 로드 실패: ' + gc.error); }
  CONTACTS = c.data || [];
  ROUNDS = r.data || [];
  ORGANIC = o.data || [];
  CAMPAIGNS = cp.data || [];
  CAMPAIGN_COLLABS = cc.data || [];
  CAMPAIGN_IMPROVEMENTS = ci.data || [];
  COLLAB_PROPOSALS = cpr.data || [];
  CALENDAR_EVENTS = gc.data || [];
  const today = new Date();
  ROUNDS.forEach(r => {
    r._start = r.start_date ? new Date(r.start_date) : null;
    r._isUpcoming = r._start ? r._start > today : false;
    r._nearTerm = r._start ? Math.abs((r._start - today)/86400000) <= 45 : false;
  });
  render();
}

function render() {
  if (activeTab === 'overview') renderOverview();
  else if (activeTab === 'seeding') renderSeeding();
  else if (activeTab === 'revenue') renderRevenue();
  else if (activeTab === 'organic') renderOrganic();
  else if (activeTab === 'campaigns') renderCampaigns();
  else if (activeTab === 'agency-analysis') renderAgencyAnalysis();
  else if (activeTab === 'brand-analysis') renderBrandAnalysis();
  else if (activeTab === 'calendar') renderCalendar();
  else if (activeTab === 'kpi') renderKpi();
  else if (activeTab === 'raw') renderRaw();
  else if (activeTab === 'collab-contacts') renderCollabProposals();
  else if (activeTab === 'domestic-collab') renderSoon('🇰🇷', '국내 협업 현황', '국내 협업 현황을 관리 중인 시트를 알려주시면 다음 화면으로 추가해드릴게요.');
  else if (activeTab === 'kakao') renderSoon('💬', '카톡플친 집행내역', '카카오톡 플러스친구 집행내역 시트를 공유해주시면 이 화면에 연결해드릴게요.');
}

// ---------------- OVERVIEW ----------------
let overviewFilters = { brand:'', category:'', status:'', assignee:'', q:'' };
let overviewSubTab = 'influencer';

function weekLabel_(date) {
  const day = date.getDate();
  const weekNo = Math.ceil(day / 7);
  const startDay = (weekNo - 1) * 7 + 1;
  const lastOfMonth = new Date(date.getFullYear(), date.getMonth()+1, 0).getDate();
  const endDay = Math.min(weekNo * 7, lastOfMonth);
  const mm = date.getMonth() + 1;
  const fmt = d => String(mm).padStart(2,'0') + '/' + String(d).padStart(2,'0');
  return { key: mm + '-' + weekNo, label: mm + '월 ' + weekNo + '주차 (' + fmt(startDay) + '~' + fmt(endDay) + ')' };
}

function renderOverview() {
  const brands = [...new Set(CONTACTS.map(c=>c.brand).filter(Boolean))];
  const categories = [...new Set(CONTACTS.map(c=>c.category).filter(Boolean))];
  const statuses = ['콜드','컨택','응답','조건협의','확정','드랍','선물완료'];
  const assignees = [...new Set(CONTACTS.map(c=>c.assignee).filter(Boolean))];

  const filtered = CONTACTS.filter(c => {

    if (overviewFilters.category && c.category !== overviewFilters.category) return false;
    if (overviewFilters.status && c.status !== overviewFilters.status) return false;
    if (overviewFilters.assignee && c.assignee !== overviewFilters.assignee) return false;

      if (!hay.includes(overviewFilters.q.toLowerCase())) return false;
    }
    return true;
  });

  document.getElementById('content').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;">
      <div>
        <h2 style="margin:0 0 4px; font-size:17px;">대시보드</h2>
        <p class="muted" style="margin:0;">인플루언서 공구 현황을 한눈에 확인하세요.</p>
      </div>
      <button class="btn ghost" id="ovRefreshBtn">🔄 새로고침</button>
    </div>
    <p style="font-size:12px; color:var(--sub); margin:10px 0 16px;">
      <span style="display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-right:5px;"></span>
      총 ${CONTACTS.length}명 · ${new Date().toLocaleString('ko-KR')} 기준
    </p>
    <div class="panel">
      <div class="controls">
        <select id="ovBrand"><option value="">전체 브랜드</option>${brands.map(b=>`<option ${overviewFilters.brand===b?'selected':''}>${esc(b)}</option>`).join('')}</select>
        <select id="ovCategory"><option value="">전체 카테고리</option>${categories.map(c=>`<option ${overviewFilters.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
        <select id="ovStatus"><option value="">전체 상태</option>${statuses.map(s=>`<option ${overviewFilters.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
        <select id="ovAssignee"><option value="">전체 담당자</option>${assignees.map(a=>`<option ${overviewFilters.assignee===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
        <input id="ovSearch" placeholder="셀러명 검색..." value="${esc(overviewFilters.q)}">
        <button class="btn ghost" id="ovResetBtn">필터 초기화</button>
        <span class="muted" style="margin-left:auto;">${filtered.length} / ${CONTACTS.length}건</span>
      </div>
    </div>
    <div class="controls" style="gap:6px;">
      <button class="btn ${overviewSubTab==='influencer'?'primary':'ghost'}" id="ovTabInfluencer">인플루언서 (마켓)</button>
      <button class="btn ${overviewSubTab==='content'?'primary':'ghost'}" id="ovTabContent">컨텐츠 협업</button>

  document.getElementById('ovStatus').onchange = e => { overviewFilters.status = e.target.value; renderOverview(); };

  document.getElementById('ovSearch').oninput = e => { overviewFilters.q = e.target.value; renderOverviewBody(filtered); };

  document.getElementById('ovTabInfluencer').onclick = () => { overviewSubTab = 'influencer'; renderOverview(); };
  document.getElementById('ovTabContent').onclick = () => { overviewSubTab = 'content'; renderOverview(); };

function renderOverviewBody(filtered) {
  if (overviewSubTab === 'content') { renderOverviewContent(); return; }

  const total = filtered.length;
  const confirmed = filtered.filter(c=>c.status==='확정').length;
  const inProgress = filtered.filter(c=>c.status==='응답' || c.status==='조건협의').length;
  const dropped = filtered.filter(c=>c.status==='드랍').length;
  const giftDone = filtered.filter(c=>c.status==='선물완료').length;
  const responded = confirmed + inProgress + dropped + giftDone;
  const responseRate = total ? Math.round(responded/total*1000)/10 : 0;

  const kpis = [
    {label:'전체 셀러 수', value: total, sub:'현재 필터 기준', hi:true},
    {label:'확정 수', value: confirmed, sub: total ? '전환율 ' + Math.round(confirmed/total*1000)/10 + '%' : ''},
    {label:'진행중 (응답~조건협의)', value: inProgress, sub:'팔로업 필요 셀러'},
    {label:'드랍 수', value: dropped, sub: total ? '전체 대비 ' + Math.round(dropped/total*1000)/10 + '%' : ''},
    {label:'응답률', value: responseRate + '%', sub:'', bar: responseRate},
  ];

  const now = new Date();
  const thisMonthConfirmed = filtered.filter(c => {
    if (c.status !== '확정' || !c.updated_at) return false;
    const d = new Date(c.updated_at);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });
  const byWeek = {};
  thisMonthConfirmed.forEach(c => {
    const d = new Date(c.updated_at);
    const w = weekLabel_(d);
    if (!byWeek[w.key]) byWeek[w.key] = { label: w.label, count: 0 };
    byWeek[w.key].count += 1;
  });
  const weekEntries = Object.values(byWeek).sort((a,b)=>a.label.localeCompare(b.label));

  const catCounts = {};
  filtered.forEach(c => { const k = c.category || '미정'; catCounts[k] = (catCounts[k]||0) + 1; });
  const catSorted = Object.entries(catCounts).sort((a,b)=>b[1]-a[1]);

  const brandCounts = {};
  filtered.forEach(c => { const k = c.brand || '미정'; brandCounts[k] = (brandCounts[k]||0) + 1; });
  const brandSorted = Object.entries(brandCounts).sort((a,b)=>b[1]-a[1]);

  const assigneeConfirmed = {};
  filtered.filter(c=>c.status==='확정').forEach(c => { const k = c.assignee || '미정'; assigneeConfirmed[k] = (assigneeConfirmed[k]||0) + 1; });
  const assigneeSorted = Object.entries(assigneeConfirmed).sort((a,b)=>b[1]-a[1]);

  document.getElementById('overviewBody').innerHTML = `
    <div class="kpi-grid" style="grid-template-columns:repeat(5,1fr);">
      ${kpis.map(k=>`
        <div class="kpi-card" style="${k.hi?'background:var(--accent-dark); border-color:var(--accent-dark);':''}">
          <div class="label" style="${k.hi?'color:#f3dde0;':''}">${k.label}</div>
          <div class="value" style="${k.hi?'color:#fff;':''}">${k.value}</div>
          <div class="sub" style="${k.hi?'color:#f3dde0;':''}">${k.sub}</div>
          ${k.bar!==undefined ? `<div style="background:var(--bg); border-radius:4px; height:6px; margin-top:8px; overflow:hidden;"><div style="width:${k.bar}%; background:var(--ok); height:100%;"></div></div>` : ''}
        </div>
      `).join('')}
    </div>
    <div class="grid-2">
      <div class="panel">
        <h3 style="margin-top:0;font-size:14px;">당월 확정 인플루언서 ${thisMonthConfirmed.length}명 · 주차별</h3>
        <canvas id="weekChart" height="140"></canvas>
        <div style="max-height:160px; overflow-y:auto; margin-top:10px;">
          ${thisMonthConfirmed.map(c=>`<div style="font-size:12.5px; padding:4px 0; border-bottom:1px solid var(--line);">${esc(c.name)} ${c.instagram?('@'+esc(c.instagram).replace(/^@/,'')):''} ${c.category?'('+esc(c.category)+')':''}</div>`).join('') || '<p class="muted">이번 달 확정 컨택이 없습니다.</p>'}
        </div>
      </div>
      <div class="panel">
        <h3 style="margin-top:0;font-size:14px;">카테고리별 비중</h3>
        <canvas id="catChart" height="180"></canvas>
      </div>
    </div>
    <div class="grid-2">
      <div class="panel"><canvas id="brandCountChart"></canvas></div>
      <div class="panel"><canvas id="assigneeConfirmChart"></canvas></div>
    </div>
  `;

  new Chart(document.getElementById('weekChart'), {
    type:'bar',
    data:{ labels: weekEntries.map(w=>w.label), datasets:[{ data: weekEntries.map(w=>w.count), backgroundColor:'#c98a92', borderRadius:5 }] },
    options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{stepSize:1}}} }
  });
  const palette = ['#7fa88a','#c98a92','#d9a441','#7c96b8','#c56b5f','#a8636d','#9bb0c9'];
  new Chart(document.getElementById('catChart'), {
    type:'doughnut',
    data:{ labels: catSorted.map(c=>c[0]), datasets:[{ data: catSorted.map(c=>c[1]), backgroundColor: palette }] },
    options:{ plugins:{legend:{position:'right', labels:{boxWidth:10,font:{size:11}}}} }
  });
  new Chart(document.getElementById('brandCountChart'), {
    type:'bar',
    data:{ labels: brandSorted.map(b=>b[0]), datasets:[{ data: brandSorted.map(b=>b[1]), backgroundColor:'#7c96b8', borderRadius:5 }] },
    options:{ indexAxis:'y', plugins:{legend:{display:false}, title:{display:true,text:'브랜드별 셀러 수'}}, scales:{y:{ticks:{font:{size:10}}}} }
  });
  new Chart(document.getElementById('assigneeConfirmChart'), {
    type:'bar',
    data:{ labels: assigneeSorted.map(a=>a[0]), datasets:[{ data: assigneeSorted.map(a=>a[1]), backgroundColor:'#7fa88a', borderRadius:5 }] },
    options:{ plugins:{legend:{display:false}, title:{display:true,text:'담당자별 확정 수'}}, scales:{y:{beginAtZero:true,ticks:{stepSize:1}}} }
  });
}

function renderOverviewContent() {
  const totalRevenue = ROUNDS.reduce((a,r)=>a+(Number(r.revenue)||0),0);
  const nearTerm = ROUNDS.filter(r=>r._nearTerm);
  const totalCampaigns = CAMPAIGNS.length;
  const totalCollabs = CAMPAIGN_COLLABS.length;
  const totalViews = CAMPAIGN_COLLABS.reduce((a,c)=>a+(Number(c.views)||0),0);
  const proposalsInProgress = COLLAB_PROPOSALS.filter(p=>p.in_progress).length;

  const kpis = [
    {label:'운영 캠페인 수', value: totalCampaigns + '개', sub:''},
    {label:'총 협업자 수', value: totalCollabs + '명', sub:''},
    {label:'총 조회수', value: totalViews.toLocaleString('ko-KR'), sub:''},
    {label:'진행중 협업 제안', value: proposalsInProgress + '건', sub: COLLAB_PROPOSALS.length + '건 중'},
    {label:'누적 공동구매 매출', value: won(totalRevenue), sub:'전체 파트너 합산'},
  ];

  document.getElementById('overviewBody').innerHTML = `
    <div class="kpi-grid">${kpis.map(k=>`
      <div class="kpi-card"><div class="label">${k.label}</div><div class="value" style="font-size:18px;">${k.value}</div><div class="sub">${k.sub}</div></div>
    `).join('')}</div>
    <div class="panel">
      <h3 style="margin-top:0;font-size:14px;">🔥 지금 진행중 / 임박한 공동구매</h3>
      <div id="spotlight"></div>
    </div>
    <div class="panel"><canvas id="collabByCampaignChart"></canvas></div>
  `;
  const sorted = nearTerm.slice().sort((a,b)=> (a.start_date||'') < (b.start_date||'') ? -1:1);
  document.getElementById('spotlight').innerHTML = sorted.length ? sorted.map(r=>`
    <div class="spotlight-card">
      <div class="row1"><span>${esc(r.agency)} · ${esc(r.seller||'')} (${esc(r.round_no||'')})</span>
        <span>${r._isUpcoming ? '<span class="badge upcoming">예정</span>' : (r.revenue ? won(r.revenue) : '<span class="badge need">정산 대기</span>')}</span></div>
      <div class="row2">${r.start_date||'-'} ~ ${r.end_date||'-'} · ${esc(r.product||'-')}</div>
    </div>
  `).join('') : '<p class="muted">임박한 회차가 없습니다.</p>';

  const byCampaign = {};
  CAMPAIGN_COLLABS.forEach(c => { const k = c.campaign_name || '기타'; byCampaign[k] = (byCampaign[k]||0) + 1; });
  const campSorted = Object.entries(byCampaign).sort((a,b)=>b[1]-a[1]);
  new Chart(document.getElementById('collabByCampaignChart'), {
    type:'bar',
    data:{ labels: campSorted.map(c=>c[0]), datasets:[{ data: campSorted.map(c=>c[1]), backgroundColor:'#c98a92', borderRadius:5 }] },
    options:{ indexAxis:'y', plugins:{legend:{display:false}, title:{display:true,text:'캠페인별 협업자 수'}} }
  });
}

let progressFilters = { brand:'', category:'', status:'', assignee:'', q:'' };
let selectedProgressContactId = null;
function renderAgencyAnalysis() {
  const brands = [...new Set(CONTACTS.map(c=>c.brand).filter(Boolean))];
  const categories = [...new Set(CONTACTS.map(c=>c.category).filter(Boolean))];
  const statuses = ['콜드','컨택','응답','조건협의','확정','드랍','선물완료'];
  const assignees = [...new Set(CONTACTS.map(c=>c.assignee).filter(Boolean))];

  const filtered = CONTACTS.filter(c => {
    if (progressFilters.brand && c.brand !== progressFilters.brand) return false;
    if (progressFilters.category && c.category !== progressFilters.category) return false;
    if (progressFilters.status && c.status !== progressFilters.status) return false;
    if (progressFilters.assignee && c.assignee !== progressFilters.assignee) return false;
    if (progressFilters.q) {
      const hay = [c.name, c.instagram].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(progressFilters.q.toLowerCase())) return false;
    }
    return true;
  });
  const confirmedList = filtered.filter(c => c.status === '확정');
  if (!selectedProgressContactId || !confirmedList.find(c=>c.id===selectedProgressContactId)) {
    selectedProgressContactId = confirmedList[0] ? confirmedList[0].id : null;
  }

  document.getElementById('content').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;">
      <div>
        <h2 style="margin:0 0 4px; font-size:17px;">진행자별 분석</h2>
        <p class="muted" style="margin:0;">확정된 셀러를 한 명씩 선택해 진행 단계와 매출을 확인하세요.</p>
      </div>
      <button class="btn ghost" id="paRefreshBtn">🔄 새로고침</button>
    </div>
    <p style="font-size:12px; color:var(--sub); margin:10px 0 16px;">
      <span style="display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-right:5px;"></span>
      총 ${CONTACTS.length}명 · ${new Date().toLocaleString('ko-KR')} 기준
    </p>
    <div class="panel">
      <div class="controls">
        <select id="paBrand"><option value="">전체 브랜드</option>${brands.map(b=>`<option ${progressFilters.brand===b?'selected':''}>${esc(b)}</option>`).join('')}</select>
        <select id="paCategory"><option value="">전체 카테고리</option>${categories.map(c=>`<option ${progressFilters.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
        <select id="paStatus"><option value="">전체 상태</option>${statuses.map(s=>`<option ${progressFilters.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
        <select id="paAssignee"><option value="">전체 담당자</option>${assignees.map(a=>`<option ${progressFilters.assignee===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
        <input id="paSearch" placeholder="셀러명 검색..." value="${esc(progressFilters.q)}">
        <button class="btn ghost" id="paResetBtn">필터 초기화</button>
        <span class="muted" style="margin-left:auto;">진행자 ${confirmedList.length}명</span>
      </div>
    </div>
    <div class="controls">
      <select id="paSelect" style="min-width:280px;">${confirmedList.map(c=>`<option value="${c.id}" ${selectedProgressContactId===c.id?'selected':''}>${esc(c.name)}${c.instagram?' @'+esc(c.instagram).replace(/^@/,''):''} · 확정 · ${esc(c.brand)||'-'}</option>`).join('') || '<option>확정된 진행자가 없습니다</option>'}</select>
      <span class="muted">확정 상태인 진행자만 목록에 표시돼요 (${confirmedList.length}명)</span>
    </div>
    <div id="progressDetail"></div>
  `;
  document.getElementById('paRefreshBtn').onclick = loadData;
  document.getElementById('paBrand').onchange = e => { progressFilters.brand = e.target.value; renderAgencyAnalysis(); };
  document.getElementById('paCategory').onchange = e => { progressFilters.category = e.target.value; renderAgencyAnalysis(); };
  document.getElementById('paStatus').onchange = e => { progressFilters.status = e.target.value; renderAgencyAnalysis(); };
  document.getElementById('paAssignee').onchange = e => { progressFilters.assignee = e.target.value; renderAgencyAnalysis(); };

  document.getElementById('paResetBtn').onclick = () => { progressFilters = { brand:'', category:'', status:'', assignee:'', q:'' }; renderAgencyAnalysis(); };
  document.getElementById('paSelect').onchange = e => { selectedProgressContactId = e.target.value; renderProgressDetail(confirmedList); };
  renderProgressDetail(confirmedList);
}
let currentProgressList_ = [];
function selectProgressContact(id) { selectedProgressContactId = id; const sel = document.getElementById('paSelect'); if (sel) sel.value = id; renderProgressDetail(currentProgressList_); }
function renderProgressDetail(confirmedList) {

  const box = document.getElementById('progressDetail');
  const c = confirmedList.find(x=>x.id===selectedProgressContactId);
  if (!c) { box.innerHTML = '<p class="muted" style="margin-top:16px;">확정된 진행자가 없습니다.</p>'; return; }

  const myRounds = ROUNDS.filter(r=>r.contact_id===c.id);

  const nextRound = myRounds.slice().sort((a,b)=>(a.start_date||'')<(b.start_date||'')?-1:1)[0];
  const weekText = c.expected_period || (nextRound && nextRound.start_date ? weekLabel_(new Date(nextRound.start_date)).label : '-');
  const lastContact = c.last_contact_date ? new Date(c.last_contact_date + 'T00:00:00') : null;
  const daysElapsed = lastContact ? Math.floor((new Date() - lastContact) / 86400000) : null;

  const stageOrder = ['콜드','컨택','응답','조건협의','확정'];
  const curIdx = stageOrder.indexOf(c.status);

  box.innerHTML = `
    <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr); margin-top:16px;">
      <div class="kpi-card" style="background:var(--accent-dark); border-color:var(--accent-dark);">

        <div class="value" style="color:#fff;">${won(revenue)}</div>
        <div class="sub" style="color:#f3dde0;">${revenue ? '' : '아직 미입력'}</div>
      </div>
      <div class="kpi-card">
        <div class="label">예상 공구 주차</div>
        <div class="value" style="font-size:15px;">${esc(weekText)}</div>
        <div class="sub">${esc(c.brand)||''}${c.category?' · '+esc(c.category):''}</div>
      </div>
      <div class="kpi-card">
        <div class="label">현재담당 / 최초컨택</div>
        <div class="value" style="font-size:15px;">${esc(c.assignee)||'-'}</div>
        <div class="sub">최초 컨택 ${esc(c.initial_contact)||'-'}</div>
      </div>
      <div class="kpi-card">
        <div class="label">최근 컨택일</div>
        <div class="value" style="font-size:15px;">${c.last_contact_date || '-'}</div>
        <div class="sub">${daysElapsed!==null ? daysElapsed+'일 전' : ''}</div>
      </div>
    </div>
    <div class="panel">
      <h3 style="margin-top:0; font-size:14px;">진행 단계</h3>
      <div style="display:flex; align-items:center; padding:10px 0;">
        ${stageOrder.map((s,i)=>`
          <div style="display:flex; align-items:center; ${i<stageOrder.length-1?'flex:1;':''}">
            <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
              <div style="width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; ${i<=curIdx?'background:var(--accent-dark); color:#fff;':'background:var(--bg); color:var(--sub);'}">${i+1}</div>
              <div style="font-size:11.5px; color:${i<=curIdx?'var(--ink)':'var(--sub)'};">${s}</div>
            </div>
            ${i<stageOrder.length-1?`<div style="flex:1; height:2px; background:${i<curIdx?'var(--accent-dark)':'var(--line)'}; margin:0 8px 18px;"></div>`:''}
          </div>
        `).join('')}
        ${c.status==='드랍' ? '<span class="badge drop" style="margin-left:12px;">드랍</span>' : ''}

          <thead><tr><th>시작일</th><th>종료일</th><th>제목</th><th>설명</th></tr></thead>

        </table></div>
      </div>
    </div>
  `;
  document.getElementById('calPrev').onclick = () => { calMonth.setMonth(calMonth.getMonth()-1); renderCalendarBody(); };
  document.getElementById('calNext').onclick = () => { calMonth.setMonth(calMonth.getMonth()+1); renderCalendarBody(); };

function renderCalendarBody() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  document.getElementById('calLabel').textContent = `${y}년 ${m+1}월`;
  const toKey = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');

  const firstOfMonth = new Date(y, m, 1);
  const startOffset = firstOfMonth.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
  const gridStart = new Date(y, m, 1 - startOffset);
  const todayKey = toKey(new Date());

  const weeks = [];
  for (let w = 0; w < totalCells / 7; w++) {
    const week = [];
    for (let d = 0; d < 7; d++) {
      const dt = new Date(gridStart);
      dt.setDate(gridStart.getDate() + w*7 + d);
      week.push(dt);
    }
    weeks.push(week);
  }

  // 회차/캘린더 일정을 하루 단위로 쪼개지 않고 (시작~종료) 구간 그대로 유지해서
  // 구글 캘린더처럼 여러 날에 걸친 막대 하나로 표시한다.
  const spans = [];
  ROUNDS.forEach(r => { if (r.start_date) spans.push({ start: r.start_date, end: r.end_date || r.start_date, label: r.agency, type: 'round' }); });
  CALENDAR_EVENTS.forEach(e => { if (e.start_date) spans.push({ start: e.start_date, end: e.end_date || e.start_date, label: e.title, type: 'gcal' }); });

  const MAX_LANES = 3;
  let weekHtml = '';
  weeks.forEach(week => {
    const weekStartKey = toKey(week[0]), weekEndKey = toKey(week[6]);
    const weekSpans = spans.filter(s => s.start <= weekEndKey && s.end >= weekStartKey)
      .sort((a,b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : (b.end > a.end ? 1 : -1)));
    const laneEndCol = [];
    const overflow = {};
    let barsHtml = '';
    weekSpans.forEach(s => {
      let startCol = week.findIndex(dt => toKey(dt) >= s.start);
      if (startCol === -1) startCol = 0;
      let endCol = 6;
      for (let c = 0; c < 7; c++) { if (toKey(week[c]) <= s.end) endCol = c; }
      if (endCol < startCol) endCol = startCol;
      let lane = 0;
      while (lane < laneEndCol.length && laneEndCol[lane] >= startCol) lane++;
      if (lane >= MAX_LANES) {
        for (let c = startCol; c <= endCol; c++) overflow[c] = (overflow[c]||0) + 1;
        return;
      }
      laneEndCol[lane] = endCol;
      barsHtml += `<div class="cal-bar ${s.type}" style="grid-row:${lane+2}; grid-column:${startCol+1} / ${endCol+2};" title="${esc(s.label)}">${esc(s.label)}</div>`;
    });
    let overflowHtml = '';
    Object.keys(overflow).forEach(c => {
      overflowHtml += `<div class="cal-overflow" style="grid-column:${Number(c)+1};">+${overflow[c]}건</div>`;
    });
    let dayCellsHtml = '', colBgHtml = '';
    week.forEach((dt, i) => {
      const inMonth = dt.getMonth() === m;
      const isToday = toKey(dt) === todayKey;
      dayCellsHtml += `<div class="cal-daynum-cell ${inMonth?'':'other-month'} ${isToday?'today':''}" style="grid-column:${i+1};"><span class="num">${dt.getDate()}</span></div>`;
      colBgHtml += `<div class="cal-colbg" style="grid-column:${i+1};"></div>`;
    });
    weekHtml += `<div class="cal-week">${colBgHtml}${dayCellsHtml}${barsHtml}${overflowHtml}</div>`;
  });

  let headHtml = '';
  ['일','월','화','수','목','금','토'].forEach(d => headHtml += `<div class="cal-head">${d}</div>`);
  document.getElementById('calGrid').innerHTML = `<div class="cal-grid-wrap"><div class="cal-headrow">${headHtml}</div>${weekHtml}</div>`;

  const todayStr = toKey(new Date());
  const activeEvents = CALENDAR_EVENTS.filter(e => e.start_date && e.start_date <= todayStr && (e.end_date || e.start_date) >= todayStr)
    .sort((a,b) => ((a.end_date||a.start_date)) < ((b.end_date||b.start_date)) ? -1 : 1);
  document.getElementById('calList').innerHTML = activeEvents.map(e => {
    const end = new Date((e.end_date || e.start_date) + 'T00:00:00');
    const today0 = new Date(todayStr + 'T00:00:00');
    const dday = Math.round((end - today0) / 86400000);
    return `<tr><td>${esc(e.title)}</td><td>${e.start_date||'-'}</td><td>${e.end_date||'-'}</td><td class="num">${dday <= 0 ? '오늘 종료' : 'D-'+dday}</td></tr>`;
  }).join('') || '<tr><td colspan="4" class="muted">오늘 진행중인 마켓 일정이 없습니다.</td></tr>';

  const monthEvents = CALENDAR_EVENTS.filter(e => e.start_date && e.start_date.slice(0,7) === `${y}-${String(m+1).padStart(2,'0')}`)
    .sort((a,b) => (a.start_date||'') < (b.start_date||'') ? -1 : 1);
  document.getElementById('calGcalList').innerHTML = monthEvents.map(e => `
    <tr><td>${e.start_date||'-'}</td><td>${e.end_date||'-'}</td><td>${esc(e.title)}</td><td class="muted" style="max-width:220px;">${esc(e.description)||'-'}</td></tr>
  `).join('') || '<tr><td colspan="4" class="muted">이번 달 구글 캘린더 일정이 없습니다.</td></tr>';
}

    if (proposalFilters.q) {
      const hay = [p.account,p.contact_person,p.promotion,p.fee].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(proposalFilters.q.toLowerCase())) return false;
    }
    return true;
  }).sort((a,b) => (a.source_sheet||'').localeCompare(b.source_sheet||'') || (Number(a.no)||0)-(Number(b.no)||0));
  document.getElementById('proposalTbody').innerHTML = rows.map(p => `
    <tr>
      <td class="muted">${esc(p.source_sheet)}</td>
      <td class="num">${esc(p.no)}</td>
      <td>${p.in_progress ? '<span class="badge confirm">✓</span>' : '-'}</td>
      <td>${esc(p.paid_type)||'-'}</td>
      <td>${esc(p.channel)||'-'}</td>
      <td>${esc(p.category)||'-'}</td>
      <td>${esc(p.type)||'-'}</td>
      <td>${esc(p.progress)||'-'}</td>
      <td class="muted">${esc(p.promotion)||'-'}</td>
      <td>${esc(p.contact_person)||'-'}</td>
      <td>${p.account ? `<a href="${esc(p.account)}" target="_blank" rel="noopener">${esc(p.account).replace(/^https?:\/\/(www\.)?instagram\.com\//,'@')}</a>` : '-'}</td>
      <td class="muted" style="max-width:220px;">${esc(p.fee)||'-'}</td>
      <td class="row-actions">
        <button class="btn small" onclick="openProposalModal('${p.id}')">수정</button>
        <button class="btn small" onclick="deleteProposal('${p.id}')">삭제</button>
      </td>
    </tr>
  `).join('') || '<tr><td colspan="13" class="muted">조건에 맞는 데이터가 없습니다.</td></tr>';
}
function openProposalModal(id) {
  const p = id ? COLLAB_PROPOSALS.find(x=>x.id===id) : {};
  const sheets = [...new Set(COLLAB_PROPOSALS.map(x=>x.source_sheet).filter(Boolean))];
  document.getElementById('modalBody').innerHTML = `
    <h3>${id ? '협업 제안 수정' : '신규 협업 제안 등록'}</h3>
    <div class="field-row">
      <div class="field"><label>캠페인/제품 탭 *</label>
        <input id="m_pSheet" list="pSheetList" value="${esc(p.source_sheet)}" placeholder="예: 6월 올영세일">
        <datalist id="pSheetList">${sheets.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
      </div>
      <div class="field"><label>No.</label><input id="m_pNo" value="${esc(p.no)}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>진행 여부</label>
        <select id="m_pInProgress"><option value="false" ${!p.in_progress?'selected':''}>미진행</option><option value="true" ${p.in_progress?'selected':''}>진행</option></select>
      </div>
      <div class="field"><label>유가/무가</label><input id="m_pPaid" value="${esc(p.paid_type)}" placeholder="유가 / 무가"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>채널</label><input id="m_pChannel" value="${esc(p.channel)}" placeholder="인스타그램"></div>
      <div class="field"><label>카테고리</label><input id="m_pCategory" value="${esc(p.category)}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>유형</label><input id="m_pType" value="${esc(p.type)}" placeholder="릴스"></div>
      <div class="field"><label>진행사항</label><input id="m_pProgress" value="${esc(p.progress)}" placeholder="컨택 전 / 컨택 중 / 회신 / 진행"></div>
    </div>
    <div class="field"><label>프로모션</label><input id="m_pPromotion" value="${esc(p.promotion)}"></div>
    <div class="field-row">
      <div class="field"><label>컨택자</label><input id="m_pContact" value="${esc(p.contact_person)}"></div>
      <div class="field"><label>계정 링크</label><input id="m_pAccount" value="${esc(p.account)}"></div>
    </div>
    <div class="field"><label>단가/비용 메모</label><textarea id="m_pFee">${esc(p.fee)}</textarea></div>
    <div class="field"><label>비고</label><input id="m_pNote" value="${esc(p.note)}"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="saveProposal(${id?`'${id}'`:'null'})">저장</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('active');
}
async function saveProposal(id) {
  const sourceSheet = document.getElementById('m_pSheet').value.trim();
  if (!sourceSheet) { toast('캠페인/제품 탭은 필수예요.'); return; }
  const payload = {
    source_sheet: sourceSheet,
    no: document.getElementById('m_pNo').value.trim() || null,
    in_progress: document.getElementById('m_pInProgress').value === 'true',
    paid_type: document.getElementById('m_pPaid').value.trim() || null,
    channel: document.getElementById('m_pChannel').value.trim() || null,
    category: document.getElementById('m_pCategory').value.trim() || null,
    type: document.getElementById('m_pType').value.trim() || null,
    progress: document.getElementById('m_pProgress').value.trim() || null,
    promotion: document.getElementById('m_pPromotion').value.trim() || null,
    contact_person: document.getElementById('m_pContact').value.trim() || null,
    account: document.getElementById('m_pAccount').value.trim() || null,
    fee: document.getElementById('m_pFee').value.trim() || null,
    note: document.getElementById('m_pNote').value.trim() || null,
    updated_at: new Date().toISOString(),
  };
  let res;
  if (id) {
    res = await sb.from('collab_proposals').update(payload).eq('id', id);
  } else {
    payload.sheet_ref = 'manual:' + sourceSheet + ':' + Date.now();
    res = await sb.from('collab_proposals').insert(payload);
  }
  if (res.error) { toast('저장 실패: ' + res.error.message); return; }
  closeModal(); toast('저장했어요.'); await loadData();
}
async function deleteProposal(id) {
  if (!confirm('이 협업 제안을 삭제할까요?')) return;
  const res = await sb.from('collab_proposals').delete().eq('id', id);
  if (res.error) { toast('삭제 실패: ' + res.error.message); return; }
  toast('삭제했어요.'); await loadData();
}

// ---------------- CAMPAIGN REPORTS TAB ----------------
let selectedCampaignRef = null;
function renderCampaigns() {
  if (!selectedCampaignRef && CAMPAIGNS.length) selectedCampaignRef = CAMPAIGNS[0].sheet_ref;
  const totalPeople = new Set(CAMPAIGN_COLLABS.map(x=>x.account_name).filter(Boolean)).size;
  const lastSync = CAMPAIGN_COLLABS.concat(CAMPAIGNS).reduce((max,x)=>{
    const t = x.updated_at ? new Date(x.updated_at) : null;
    return (t && (!max || t>max)) ? t : max;
  }, null);
  const lastSyncStr = lastSync ? lastSync.toLocaleString('ko-KR') : '-';

  document.getElementById('content').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;">
      <div>
        <h2 style="margin:0 0 4px; font-size:17px;">컨텐츠 협업 캠페인</h2>
        <p class="muted" style="margin:0;">마켓 진행자와는 별도로 진행된 콘텐츠 협업 캠페인을 관리하세요.</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn ghost" id="refreshBtn4">🔄 새로고침</button>
        <button class="btn primary" id="addCampaignBtn">＋ 신규 등록</button>
      </div>
    </div>
    <p style="font-size:12px; color:var(--sub); margin:10px 0 16px;">
      <span style="display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-right:5px;"></span>
      총 ${totalPeople}명 · ${lastSyncStr} 기준
    </p>
    <div class="controls">
      <select id="fCampaign">${CAMPAIGNS.map(c=>`<option value="${esc(c.sheet_ref)}" ${selectedCampaignRef===c.sheet_ref?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      <span class="muted">총 ${CAMPAIGNS.length}개 캠페인 · 협업 ${CAMPAIGN_COLLABS.length}건</span>
    </div>
    <div id="campaignDetail"></div>
  `;
  document.getElementById('fCampaign').onchange = e => { selectedCampaignRef = e.target.value; renderCampaignDetail(); };
  document.getElementById('refreshBtn4').onclick = loadData;
  document.getElementById('addCampaignBtn').onclick = () => toast('신규 캠페인은 구글시트에 탭을 추가해서 만들어주세요 (자동으로 감지됩니다).');
  renderCampaignDetail();
}
function renderCampaignDetail() {
  const c = CAMPAIGNS.find(x=>x.sheet_ref===selectedCampaignRef);
  const box = document.getElementById('campaignDetail');
  if (!c) { box.innerHTML = '<p class="muted">캠페인이 없습니다.</p>'; return; }
  const collabs = CAMPAIGN_COLLABS.filter(x=>x.campaign_sheet_ref===c.sheet_ref).sort((a,b)=>Number(a.no)-Number(b.no));
  const improvements = CAMPAIGN_IMPROVEMENTS.filter(x=>x.campaign_sheet_ref===c.sheet_ref).sort((a,b)=>Number(a.no)-Number(b.no));
  const kpis = [
    {label:'목표 VIEW', value: c.target_view!=null ? Number(c.target_view).toLocaleString('ko-KR') : '-', hi:true},
    {label:'도달 VIEW', value: c.reached_view!=null ? Number(c.reached_view).toLocaleString('ko-KR') : '-'},
    {label:'달성률', value: c.achievement_rate || '-'},
    {label:'총 매출', value: won(c.total_revenue)},
    {label:'업로드 효과', value: c.upload_effect || '-'},
  ];
  box.innerHTML = `
    <div style="margin:14px 0 10px; color:var(--sub); font-size:12.5px;">담당자: <strong style="color:var(--ink);">${esc(c.assignee)||'-'}</strong>${c.imc_cost!=null ? ' · IMC비용: <strong style="color:var(--ink);">'+won(c.imc_cost)+'</strong>' : ''}</div>
    <div class="kpi-grid" style="grid-template-columns:repeat(5,1fr); margin-bottom:20px;">
      ${kpis.map(k=>`<div class="kpi-card" style="${k.hi?'background:var(--accent-dark); border-color:var(--accent-dark);':''}">
        <div class="label" style="${k.hi?'color:#f3dde0;':''}">${k.label}</div>
        <div class="value" style="${k.hi?'color:#fff;':''}">${k.value}</div>
      </div>`).join('')}
    </div>
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="margin:0;font-size:14px;">협업 리스트 (${collabs.length}건)</h3>
        <button class="btn primary small" onclick="openCollabModal(null, '${c.sheet_ref}')">＋ 협업자 추가</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>채널</th><th>계정명</th><th>구분/노출제품</th><th>콘텐츠 유형</th><th>협업형태</th><th>업로드일</th><th>조회수</th><th>섭외상태</th><th>담당자 코멘트</th><th></th></tr></thead>
          <tbody>
            ${collabs.map(x => `
              <tr>
                <td>${esc(x.channel)||'-'}</td>
                <td>${esc(x.account_name)||'-'}</td>
                <td class="muted" style="max-width:260px;">${esc(x.category)||''}${x.category&&x.exposed_product?' · ':''}${esc(x.exposed_product)||''}</td>
                <td>${esc(x.content_type)||'-'}</td>
                <td>${esc(x.collab_type)||'-'}</td>
                <td class="muted">${x.upload_date||'-'}</td>
                <td class="num">${x.views!=null?Number(x.views).toLocaleString('ko-KR'):'-'}</td>
                <td>${esc(x.recruit_status)||'-'}</td>
                <td class="muted" style="max-width:260px;">${esc(x.manager_comment)||'-'}</td>
                <td class="row-actions">
                  <button class="btn small" onclick="openCollabModal('${x.id}', '${c.sheet_ref}')">수정</button>
                </td>
              </tr>
            `).join('') || '<tr><td colspan="10" class="muted">데이터가 없습니다.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <h3 style="margin-top:0;font-size:14px;">보강 포인트 (${improvements.length}건)</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>No</th><th>카테고리</th><th>보강 내용</th><th>근거</th></tr></thead>
          <tbody>
            ${improvements.map(x => `
              <tr>
                <td>${esc(x.no)}</td>
                <td>${esc(x.category)||'-'}</td>
                <td>${esc(x.improvement)||'-'}</td>
                <td class="muted">${esc(x.evidence)||'-'}</td>
              </tr>
            `).join('') || '<tr><td colspan="4" class="muted">데이터가 없습니다.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

  const x = id ? CAMPAIGN_COLLABS.find(r=>r.id===id) : {};
  const campaign = CAMPAIGNS.find(c=>c.sheet_ref===campaignSheetRef);
  document.getElementById('modalBody').innerHTML = `
    <h3>${id ? '협업 정보 수정' : '신규 협업자 추가'} <span class="muted" style="font-size:12px;">(${esc(campaign ? campaign.name : '')})</span></h3>

async function saveCollab(id, campaignSheetRef) {
  const accountName = document.getElementById('m_ccAccount').value.trim();
  if (!accountName) { toast('계정명은 필수예요.'); return; }
  const numOrNull = v => v === '' ? null : Number(v);
  const payload = {
    channel: document.getElementById('m_ccChannel').value.trim() || null,
    account_name: accountName,
    category: document.getElementById('m_ccCategory').value.trim() || null,
    exposed_product: document.getElementById('m_ccProduct').value.trim() || null,
    content_type: document.getElementById('m_ccContentType').value.trim() || null,
    collab_type: document.getElementById('m_ccCollabType').value.trim() || null,
    upload_date: document.getElementById('m_ccUploadDate').value || null,
    views: numOrNull(document.getElementById('m_ccViews').value),
    content_link: document.getElementById('m_ccLink').value.trim() || null,
    recruit_status: document.getElementById('m_ccStatus').value.trim() || null,
    auto_dm: document.getElementById('m_ccAutoDm').value.trim() || null,
    manager_comment: document.getElementById('m_ccComment').value.trim() || null,
    updated_at: new Date().toISOString(),
  };
  let res;
  if (id) {
    res = await sb.from('campaign_collabs').update(payload).eq('id', id);
  } else {
    const existing = CAMPAIGN_COLLABS.filter(x=>x.campaign_sheet_ref===campaignSheetRef);
    const nextNo = existing.reduce((m,x)=>Math.max(m, Number(x.no)||0), 0) + 1;
    payload.campaign_sheet_ref = campaignSheetRef;
    const camp = CAMPAIGNS.find(c=>c.sheet_ref===campaignSheetRef);
    payload.campaign_name = camp ? camp.name : null;
    payload.no = String(nextNo);
    payload.sheet_ref = campaignSheetRef + ':manual:' + Date.now();
    res = await sb.from('campaign_collabs').insert(payload);
  }
  if (res.error) { toast('저장 실패: ' + res.error.message); return; }
  closeModal(); toast('저장했어요.'); await loadData();
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });
</script>
